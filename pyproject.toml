[project]
name = "spraydeservice"
version = "0.1.0"
description = "Spray credentials against common network services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "paramiko>=5.0.0",
    "pymysql>=1.2.0",
    "pysmb>=1.2.15",
]

[project.scripts]
spraydeservice = "spraydeservice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spraydeservice"]

